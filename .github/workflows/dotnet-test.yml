name: .NET Unit Tests

on:
  pull_request:

jobs:
  dotnet-test:
    # ↓ Change this to "false" to disable the workflow without any alert messages.
    if: ${{ true }}
    # ↑ Change to "true" (or delete) to enable the workflow.
    
    name: Run unit tests
    runs-on: windows-latest
    permissions:
      contents: read

    env:
      SIXLABORS_LICENSE_KEY: ${{ secrets.SIXLABORS_LICENSE_KEY }}
    
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Test
        run: dotnet test --no-build --verbosity normal --report-spekt-nunit "LogFilePath=TestResults/TestResults.{assembly}.xml"

      - name: Upload test result artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          path: _artifacts/bin/**/debug/TestResults/TestResults.*.xml

  publish-test-results:
    name: Publish test results
    needs: dotnet-test
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}

    permissions:
      checks: write
      pull-requests: write

    steps:
      - name: Download test result artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: test-results # destination folder

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@7622c5bf3d112a72ab4fa3951c2aa5723d8ab92d
        with:
          files: test-results/**/TestResults.*.xml
